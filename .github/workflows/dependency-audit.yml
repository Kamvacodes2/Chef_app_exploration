name: Dependency audit

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      concurrency_suffix:
        description: Unique caller suffix so parallel reusable gates cannot cancel one another
        required: false
        type: string
        default: standalone
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

concurrency:
  group: dependency-audit-${{ inputs.concurrency_suffix || github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run dependency audit gate
        run: pnpm test:ci:dependency-audit
