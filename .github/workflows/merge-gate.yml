name: Merge gate

# This is the single check to require in branch protection for main. The named
# child workflows run the same existing gates as the standalone main/scheduled
# workflows, in parallel. The final job stays named "All checks" and fails
# closed if any child gate fails or is skipped.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: merge-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml
    with:
      concurrency_suffix: merge-gate
    permissions:
      contents: read

  security:
    name: Security tests
    uses: ./.github/workflows/security.yml
    with:
      concurrency_suffix: merge-gate
    permissions:
      contents: read

  dependency-audit:
    name: Production dependency audit
    uses: ./.github/workflows/dependency-audit.yml
    with:
      concurrency_suffix: merge-gate
    permissions:
      contents: read

  coverage:
    name: Coverage
    uses: ./.github/workflows/coverage.yml
    with:
      concurrency_suffix: merge-gate
    permissions:
      contents: read

  build:
    name: Production build
    uses: ./.github/workflows/build.yml
    with:
      concurrency_suffix: merge-gate
    permissions:
      contents: read

  playwright:
    name: Playwright E2E
    uses: ./.github/workflows/playwright.yml
    with:
      concurrency_suffix: merge-gate
    permissions:
      contents: read

  accessibility:
    name: Accessibility
    uses: ./.github/workflows/a11y.yml
    with:
      concurrency_suffix: merge-gate
    permissions:
      contents: read

  all-checks:
    name: All checks
    if: ${{ always() }}
    needs:
      - quality
      - security
      - dependency-audit
      - coverage
      - build
      - playwright
      - accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI gate to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY: ${{ needs.security.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          COVERAGE: ${{ needs.coverage.result }}
          BUILD: ${{ needs.build.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
          ACCESSIBILITY: ${{ needs.accessibility.result }}
        run: |
          set -euo pipefail
          printf 'Quality: %s\nSecurity tests: %s\nDependency audit: %s\nCoverage: %s\nBuild: %s\nPlaywright E2E: %s\nAccessibility: %s\n' \
            "$QUALITY" "$SECURITY" "$DEPENDENCY_AUDIT" "$COVERAGE" "$BUILD" "$PLAYWRIGHT" "$ACCESSIBILITY"
          for result in "$QUALITY" "$SECURITY" "$DEPENDENCY_AUDIT" "$COVERAGE" "$BUILD" "$PLAYWRIGHT" "$ACCESSIBILITY"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI gate did not succeed; refusing to pass All checks."
              exit 1
            fi
          done
