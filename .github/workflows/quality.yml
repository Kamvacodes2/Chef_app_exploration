name: Quality

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      concurrency_suffix:
        description: Unique caller suffix so parallel reusable gates cannot cancel one another
        required: false
        type: string
        default: standalone
  workflow_dispatch:

concurrency:
  group: quality-${{ inputs.concurrency_suffix || github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  DEPLOY_ENV: ci
  POSTGRES_USER: chefmate_ci
  POSTGRES_PASSWORD: CHANGE_ME_CI_ONLY
  POSTGRES_DB: chefmate_ci
  DATABASE_URL: postgresql://chefmate_ci:CHANGE_ME_CI_ONLY@127.0.0.1:5432/chefmate_ci
  CHEFMATE_TEST_PG_URL: postgresql://chefmate_ci:CHANGE_ME_CI_ONLY@127.0.0.1:5432/postgres
  KMS_LOCAL_DEV_KEY: ci-only-not-a-real-key-value

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: chefmate_ci
          POSTGRES_PASSWORD: CHANGE_ME_CI_ONLY
          POSTGRES_DB: chefmate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chefmate_ci -d chefmate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Verify every required test suite exists
        run: pnpm test:ci:preflight
      - name: Apply migrations from empty
        run: pnpm db:migrate
      - name: Run deterministic quality gate
        run: pnpm test:ci:quality
