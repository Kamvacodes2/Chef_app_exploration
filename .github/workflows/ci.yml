name: CI

# Blueprint section 19.2. Pull requests must pass formatting/lint/typecheck,
# unit/contract, database/migration/integration/security, coverage, build and
# the Playwright + accessibility suites.
#
# Secret handling: no step echoes the environment, and no step prints a
# connection string. The database URL below points at an ephemeral service
# container on localhost and is not a credential of any real system.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede stale runs on the same ref, but never mark a skipped suite green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.20.0"
  # Local-only credentials for the disposable service container below. The
  # password is a deliberate CHANGE_ME_* placeholder rather than a
  # credential-shaped string: this container lives for the lifetime of one CI
  # job, is only reachable on the runner's loopback interface, and is destroyed
  # with the runner. Keeping the CHANGE_ME_ prefix also keeps this file clear of
  # the repository's own secret scanner (tests/security/secrets.test.ts).
  POSTGRES_USER: chefmate_ci
  POSTGRES_PASSWORD: CHANGE_ME_CI_ONLY
  POSTGRES_DB: chefmate_ci

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        # Pinned, never `latest`, and identical to infra/docker-compose.yml and
        # packages/testkit's Docker strategy.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: chefmate_ci
          POSTGRES_PASSWORD: CHANGE_ME_CI_ONLY
          POSTGRES_DB: chefmate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chefmate_ci -d chefmate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DEPLOY_ENV: ci
      # The password matches the POSTGRES_PASSWORD placeholder above. It is not a
      # credential: see the comment on the workflow-level `env` block.
      DATABASE_URL: postgresql://chefmate_ci:CHANGE_ME_CI_ONLY@127.0.0.1:5432/chefmate_ci
      # Test suites create their own uniquely named disposable database on this
      # server and drop it afterwards.
      CHEFMATE_TEST_PG_URL: postgresql://chefmate_ci:CHANGE_ME_CI_ONLY@127.0.0.1:5432/postgres
      KMS_LOCAL_DEV_KEY: ci-only-not-a-real-key-value
      # NEXT_PUBLIC_CHEFMATE_API_URL / NEXT_PUBLIC_MEALS_API_URL are deliberately
      # NOT set here. Setting them job-wide leaks into the suites that pin the
      # documented unset-environment default in apps/web/src/lib/env.ts
      # (http://localhost:3001) and fails them for no product reason. `pnpm
      # test:ci` scopes the S02 API URL to the suites that need it (build, e2e,
      # a11y) and strips it from the rest -- see scripts/lib/pipeline.ts.

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Caches the pnpm store keyed on the lockfile.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` is required: the ubuntu-24.04 runner image does not ship
      # the GTK4/gstreamer libraries Playwright's chromium/webkit need (e2e
      # failed with "Host system is missing dependencies" without it, run
      # 32234212807). Its `apt-get` step can stall with zero output on a busy
      # runner, so each attempt is capped at 4 minutes and retried up to 3
      # times; a successful run is idempotent. Browser binaries are cached
      # separately above.
      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            if timeout 240 pnpm --filter @chefmate/web exec playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "playwright install attempt ${attempt} failed; retrying"
          done
          exit 1

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Apply migrations from empty
        run: pnpm db:migrate

      # `test:ci` is the single gate. It re-runs preflight (every required root
      # script and suite must exist and be non-empty), provisions its own
      # disposable database on the service container, and runs the whole
      # pipeline. It fails if any required suite is absent or misconfigured.
      - name: Run the full gate
        run: pnpm test:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            coverage
            apps/web/coverage
          retention-days: 14
          if-no-files-found: ignore
