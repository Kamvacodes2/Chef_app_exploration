name: Build

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      concurrency_suffix:
        description: Unique caller suffix so parallel reusable gates cannot cancel one another
        required: false
        type: string
        default: standalone
  workflow_dispatch:

concurrency:
  group: build-${{ inputs.concurrency_suffix || github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_PUBLIC_CHEFMATE_API_URL: http://127.0.0.1:4000

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run production build
        run: pnpm test:ci:build
