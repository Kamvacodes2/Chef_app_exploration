name: Security

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      concurrency_suffix:
        description: Unique caller suffix so parallel reusable gates cannot cancel one another
        required: false
        type: string
        default: standalone
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ inputs.concurrency_suffix || github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  security:
    name: Security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run security test gate
        run: pnpm test:ci:security
