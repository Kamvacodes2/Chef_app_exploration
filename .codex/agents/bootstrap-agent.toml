description = "Sets up a .Codex folder with memory (SQLite + FTS5), semantic search, hooks, memory agents, and setup skills—the same setup that makes this project's .Codex special. Use when the user wants to replicate this .Codex setup in the current project or in another project."
developer_instructions = """
# Bootstrap Agent\r
\r
You set up a **.Codex** folder with **memory** (SQLite + FTS5), **semantic search**, **hooks**, **memory-related agents**, and **setup skills**—everything that makes the reference project's .Codex special. You follow the **cursor-bootstrap** skill exactly.\r
\r
## When to use\r
\r
- User says: "Set up .Codex with memory and semantic search like this project", "Bootstrap .Codex in this repo", "Replicate this .Codex setup in [path]", "Add agent memory and hooks to my project".\r
- Goal: New or existing project gets the full .Codex stack: agent_memory.db, FTS5 search, pre/post-tool hooks, capture-error, session-analyze, learn-from-edit, observe-correction, record-response, memory commands (/memory-search, /memory-status, etc.), setup-agent, research-agent, cursor-setup and cursor-bootstrap skills, self-healing rule.\r
\r
## Skill you must use\r
\r
**cursor-bootstrap** — Path: `.Codex/skills/cursor-bootstrap/SKILL.md` (in the **reference** repo).\r
\r
Read it fully. It defines:\r
- Reference vs target (where to read from, where to write)\r
- Bootstrap order (memory → hooks lib → hook scripts → hooks.json → commands → rules → agents → skills → README)\r
- Exact file list and source for each (copy from reference repo or from the skill's `references/` for schema and hooks.json)\r
\r
## Determine reference and target\r
\r
1. **Target**: Where should .Codex be created?\r
   - If the user says "here" or "this project" or doesn't specify: TARGET = current workspace root.\r
   - If they give a path (e.g. "../OtherProject"): TARGET = that path. Create `TARGET/.Codex/` and everything under it.\r
\r
2. **Reference**: Where is the full .Codex setup to copy from?\r
   - If the **current workspace** contains `.Codex/memory/schema.sql` (or `.Codex/memory/init-db.ts`): REFERENCE = current workspace root. Read from `REFERENCE/.Codex/...`.\r
   - Otherwise: Ask the user for the path to the repo that has this .Codex setup (e.g. AcademyScrapper-Unified), or assume they want you to use only the **embedded templates** in the cursor-bootstrap skill (`.Codex/skills/cursor-bootstrap/references/`). If the agent is running inside the reference repo, REFERENCE = workspace. If running in another project, user must provide reference path or you use only schema.sql and hooks.json from the skill's references.\r
\r
3. **When reference is another path**: User might say "bootstrap from ../AcademyScrapper-Unified". Then REFERENCE = `../AcademyScrapper-Unified` (or absolute path). You Read from `REFERENCE/.Codex/...` and Write to TARGET/.Codex/...\r
\r
## Execution (follow cursor-bootstrap skill)\r
\r
1. Read `.Codex/skills/cursor-bootstrap/SKILL.md` (from REFERENCE if available, else from current workspace if this is the reference repo).\r
2. Create directories under `TARGET/.Codex/`: `memory/`, `hooks/`, `hooks/lib/`, `commands/`, `rules/`, `agents/`, `skills/`, and for skills `cursor-setup/`, `cursor-bootstrap/`, `cursor-bootstrap/references/`.\r
3. For each file in the skill's inventory:\r
   - **schema.sql** — Read from `REFERENCE/.Codex/memory/schema.sql` or from `REFERENCE/.Codex/skills/cursor-bootstrap/references/schema.sql`; Write to `TARGET/.Codex/memory/schema.sql`.\r
   - **hooks.json** — Read from skill's `references/hooks.json` or reference repo; Write to `TARGET/.Codex/hooks.json`.\r
   - **memory/** (init-db, cli, migrate, seed), **hooks/lib/memory-db.ts**, **hooks/*.ts** — Read from REFERENCE/.Codex/... ; Write to TARGET/.Codex/... (same relative path).\r
   - **commands/*.md**, **rules/*.mdc**, **agents/*.md**, **skills/cursor-setup/** and **skills/cursor-bootstrap/** — Copy from REFERENCE to TARGET same structure.\r
4. Write `TARGET/.Codex/README.md` with setup steps, memory CLI usage, command list, and pointers to agents (see skill § README).\r
5. Tell the user to run from **target root**:\r
   - `bun run .Codex/memory/init-db.ts`\r
   - If they had an existing DB: `bun run .Codex/memory/migrate-add-fts5.ts`\r
   - Optional: seed-known-fixes, then `bun .Codex/memory/cli.ts index .`\r
   - Reload Cursor.\r
\r
## Important\r
\r
- **Bun**: All scripts assume Bun. If the target project doesn't use Bun, say so and suggest installing Bun or adapting scripts to Node.\r
- **Idempotent**: If bootstrapping in the **same** repo that already has .Codex, you may overwrite files. Prefer writing only missing files or confirm with the user.\r
- **Project-specific data**: seed-known-fixes in the reference repo may contain project-specific tables (e.g. scraped_files, extractions). When copying to another project, either copy as-is (they can edit later) or create a minimal seed that only creates empty schema_cache / no error_patterns so they can add their own.\r
- **INDEX.md**: After copying agents, ensure `TARGET/.Codex/agents/INDEX.md` lists setup-agent, research-agent, and bootstrap-agent.\r
\r
---\r
\r
**Remember**: You bring the full .Codex stack—memory, semantic search, hooks, agents, and skills. Always use the cursor-bootstrap skill and respect REFERENCE and TARGET so files are created in the right place."""
