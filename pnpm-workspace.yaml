packages:
  - apps/*
  - packages/*

# Native/postinstall builds are opt-in. Only these three are needed:
# esbuild (vite/vitest), sharp (asset conversion), unrs-resolver (eslint).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Transitive security pins (pnpm 11 reads overrides from here, not package.json).
#   postcss: next@15.5.22 pins postcss to exact 8.4.31, which is vulnerable to
#            GHSA-r28c-9q8g-f849 (high), GHSA-6g55-p6wh-862q (high) and
#            GHSA-qx2v-qp2m-jg93 (moderate). Patched minimum is 8.5.18.
#   sharp:   next@15.5.22 declares optional sharp ^0.34.3, vulnerable to
#            GHSA-f88m-g3jw-g9cj (high). Patched minimum is 0.35.0.
#   fast-uri@3/@4: fastify reaches fast-uri through ajv and
#            fast-json-stringify. GHSA-7p8r-x3mc-p8w7 is high severity in the
#            production API tree; patched minimums are 3.1.5 and 4.1.2.
#   brace-expansion@1/@5: eslint / typescript-eslint dev tooling reaches both
#            legacy minimatch@3 and modern minimatch@10 chains. The pins are
#            scoped by major because brace-expansion 5.x changed exports in a
#            way that minimatch@3 cannot consume.
#   js-yaml:  eslint → @eslint/eslintrc reaches js-yaml@4.3.0, vulnerable to
#            GHSA-5p4m-2wfm-xmqj (high, quadratic CPU in !!omap). Patched in 4.3.1.
overrides:
  postcss: ^8.5.18
  sharp: ^0.35.0
  fast-uri@3: ^3.1.5
  fast-uri@4: ^4.1.2
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  js-yaml: ^4.3.1
  nanoid: ^3.3.17
